services:
  api:
    build: ./backend
    command: gunicorn --bind 0.0.0.0:5000 app:app
    env_file: .env
    ports: ["5000:5000"]
    volumes: ["maayabreaker_data:/app/data"]
  worker:
    build: ./backend
    command: python worker.py
    env_file: .env
    volumes: ["maayabreaker_data:/app/data"]
volumes:
  maayabreaker_data:
